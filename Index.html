<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Audio Studio - Exact Crop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050505; 
    --glass-bg: rgba(20, 20, 20, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-base: #ffffff; 
    --text-subdued: #a0a0a0; 
    
    --accent-color: 180, 150, 255; 
    --bass-scale: 1; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-base); color: var(--text-base); font-family: 'Inter', sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 20px; gap: 20px;
    user-select: none;
  }

  /* --- ФОН --- */
  .global-bg {
    position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
    background-size: cover;
    background-position: center;
    filter: blur(140px) brightness(0.15) saturate(120%); 
    z-index: -2;
    transition: background-image 1.5s ease-in-out;
    transform: scale(calc(1 + (var(--bass-scale) - 1) * 0.2));
    transition: transform 0.1s ease-out;
  }
  
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
    z-index: -1; pointer-events: none;
  }

  .main-layout { display: flex; flex: 1; gap: 20px; min-height: 0; position: relative; z-index: 1; }

  /* --- СТЕКЛО --- */
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(50px) saturate(150%);
    -webkit-backdrop-filter: blur(50px) saturate(150%);
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 20px 50px rgba(0,0,0,0.6);
  }

  /* --- ЛЕВАЯ ПАНЕЛЬ --- */
  .sidebar { width: 380px; display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 28px 24px; font-size: 20px; font-weight: 800; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.5px; }
  .add-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .add-btn:hover { background: rgba(var(--accent-color), 0.15); border-color: rgba(var(--accent-color), 0.4); transform: scale(1.05); box-shadow: 0 0 20px rgba(var(--accent-color), 0.2); }
  .track-list { flex: 1; overflow-y: auto; padding: 16px; }
  
  .track-item { 
    display: flex; align-items: center; gap: 16px; padding: 12px; 
    border-radius: 20px; cursor: pointer; transition: all 0.3s; 
    margin-bottom: 8px; border: 1px solid transparent; position: relative; 
    overflow: hidden; background: rgba(255,255,255,0.02); 
  }
  
  .track-item::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--track-color); opacity: 0.1; transition: opacity 0.3s; z-index: 0;
    pointer-events: none;
  }
  
  .track-item > * { position: relative; z-index: 1; }

  .track-item:hover { background: rgba(255,255,255,0.04); transform: translateX(4px); }
  .track-item:hover::before { opacity: 0.2; }
  
  .track-item.active { 
    background: rgba(255,255,255,0.08); 
    border-color: rgba(255,255,255,0.1); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
  }
  .track-item.active::before { opacity: 0.3; }
  
  .track-cover-small { width: 56px; height: 56px; background: #1a1a1a; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .track-cover-small img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .track-cover-small.has-cover img { display: block; }
  .track-cover-small.has-cover svg { display: none; }
  .track-cover-small svg { width: 28px; height: 28px; fill: #555; }
  
  .track-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
  .track-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; letter-spacing: -0.3px; }
  .track-artist { font-size: 13px; color: var(--text-subdued); font-weight: 500; }

  .more-btn {
    background: rgba(255,255,255,0.05); border: none; color: var(--text-subdued);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    opacity: 0;
  }
  .track-item:hover .more-btn { opacity: 1; }
  .more-btn:hover { background: rgba(255,255,255,0.15); color: white; }
  .more-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* === КОНТЕКСТНОЕ МЕНЮ === */
  .context-menu {
    position: absolute; background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 6px; display: none; flex-direction: column; gap: 2px;
    z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    min-width: 180px;
  }
  .context-menu.open { display: flex; }
  
  .context-item {
    padding: 10px 14px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 500; color: var(--text-base);
    transition: background 0.2s;
  }
  .context-item:hover { background: rgba(var(--accent-color), 0.2); color: white; }
  .context-item svg { width: 18px; height: 18px; fill: currentColor; }

  /* --- ПРАВАЯ ПАНЕЛЬ --- */
  .now-playing-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

  .spin-container {
    width: 420px; height: 420px;
    position: relative; display: flex; align-items: center; justify-content: center;
    animation: spin 20s linear infinite; 
    animation-play-state: paused;
    transform: scale(var(--bass-scale));
    transition: transform 0.15s ease-out;
  }
  .spin-container.playing { animation-play-state: running; }

  .vinyl-disc {
    width: 100%; height: 100%; border-radius: 50%;
    background: 
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 40%, rgba(var(--accent-color), 0.15) 75%, rgba(0,0,0,0.95) 100%),
      repeating-linear-gradient(45deg, #050505, #050505 2px, #0a0a0a 2px, #0a0a0a 4px);
    box-shadow: 
      inset 0 0 60px rgba(0,0,0,0.9), 
      inset 0 0 15px rgba(var(--accent-color), 0.2),
      0 0 50px rgba(var(--accent-color), 0.15),
      0 20px 60px rgba(0,0,0,0.9);
    position: relative; display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(var(--accent-color), 0.15);
    overflow: hidden;
  }
  
  .vinyl-disc::after {
    content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%);
    z-index: 5; pointer-events: none;
  }

  .vinyl-disc::before {
    content: ''; position: absolute; width: 92%; height: 92%; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 0 0 8px rgba(0,0,0,0.4), 0 0 0 16px rgba(0,0,0,0.4), 0 0 0 24px rgba(0,0,0,0.4), 0 0 0 32px rgba(0,0,0,0.4);
    z-index: 1;
  }

  .vinyl-cover {
    width: 55%; height: 55%; border-radius: 50%; background: #111;
    z-index: 3; 
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    border: 6px solid #080808; 
    box-shadow: 0 0 30px rgba(var(--accent-color), 0.4), inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
  }
  
  .vinyl-cover.full-cover {
    width: 100%; height: 100%; border: none; border-radius: 50%;
  }
  
  .full-cover-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 4; pointer-events: none;
    display: none;
  }
  .vinyl-cover.full-cover .full-cover-overlay { display: block; }

  /* Стили для картинок в плеере */
  .img-normal, .img-half, .img-gif { 
    width: 100%; height: 100%; display: none;
    position: absolute; top: 0; left: 0;
  }
  
  .img-normal, .img-gif {
    object-fit: cover; 
  }
  
  /* Для дихотомии */
  .img-half {
    object-fit: contain; /* Позволяет картинке быть меньше или больше круга */
    transform-origin: center center;
  }

  .img-normal { z-index: 3; }
  .img-gif { z-index: 3; }
  
  /* Дихотомия - наложение */
  .img-half.silent { opacity: 1; z-index: 1; }
  .img-half.sound { opacity: 0; z-index: 2; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .vinyl-cover.is-playing .img-half.silent { opacity: 0; }
  .vinyl-cover.is-playing .img-half.sound { opacity: 1; }

  .vinyl-cover.has-cover .img-normal,
  .vinyl-cover.has-cover .img-half,
  .vinyl-cover.has-cover .img-gif { display: block; }
  
  .vinyl-cover.has-cover svg { display: none; }
  .vinyl-cover svg { width: 60px; height: 60px; fill: #444; }
  
  .vinyl-hole { position: absolute; width: 18px; height: 18px; background: #000; border-radius: 50%; z-index: 6; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); border: 2px solid rgba(255,255,255,0.1); }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* --- НИЖНЯЯ ПАНЕЛЬ --- */
  .player-bar { height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; flex-shrink: 0; z-index: 2; }
  .player-left { width: 30%; display: flex; align-items: center; gap: 16px; }
  .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .controls { display: flex; align-items: center; gap: 24px; }
  
  .ctrl-btn { background: none; border: none; color: var(--text-subdued); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; position: relative; }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; transition: fill 0.2s, transform 0.1s; }
  .ctrl-btn:hover { color: var(--text-base); transform: scale(1.1); }
  .ctrl-btn.active { color: rgb(var(--accent-color)); filter: drop-shadow(0 0 8px rgba(var(--accent-color), 0.5)); }
  .ctrl-btn:active { transform: scale(0.95); }
  
  .ctrl-btn.repeat-one::after {
    content: '1'; position: absolute; bottom: -4px; right: -4px;
    font-size: 10px; font-weight: 800; background: rgb(var(--accent-color));
    color: black; width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .play-btn { width: 60px; height: 60px; background: var(--text-base); color: var(--bg-base); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 6px 25px rgba(255,255,255,0.15); }
  .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(var(--accent-color), 0.4); background: rgb(var(--accent-color)); color: white; }
  .play-btn svg { width: 26px; height: 26px; fill: currentColor; margin-left: 4px; }
  .play-btn.playing svg { margin-left: 0; }

  .progress-row { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-subdued); font-variant-numeric: tabular-nums; font-weight: 600; }
  .slider-container { flex: 1; height: 20px; display: flex; align-items: center; position: relative; cursor: pointer; }
  .slider-track { width: 100%; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; position: absolute; pointer-events: none; }
  .slider-fill { height: 100%; background: rgb(var(--accent-color)); border-radius: 2px; width: 0%; position: absolute; pointer-events: none; box-shadow: 0 0 8px rgba(var(--accent-color), 0.4); }
  .slider-input { width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; margin: 0; padding: 0; -webkit-appearance: none; }
  .slider-thumb-visual { position: absolute; width: 10px; height: 10px; background: white; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.6); pointer-events: none; z-index: 1; opacity: 0; transition: opacity 0.1s; transform: translateX(-50%); top: 50%; margin-top: -5px; }
  .slider-container:hover .slider-thumb-visual { opacity: 1; }
  .slider-container:hover .slider-fill { filter: brightness(1.2); }

  .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 16px; color: var(--text-subdued); }
  .speed-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-subdued); font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
  .speed-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-base); }
  .speed-btn.active { color: rgb(var(--accent-color)); border-color: rgba(var(--accent-color), 0.4); background: rgba(var(--accent-color), 0.1); }
  .volume-icon-btn { background: none; border: none; color: var(--text-subdued); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
  .volume-icon-btn:hover { color: var(--text-base); }
  .volume-icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .volume-container { width: 100px; flex: none; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
  input[type="file"] { display: none; }

  /* === МОДАЛЬНОЕ ОКНО РЕДАКТОРА === */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.open { display: flex; }
  .modal-content { background: rgba(20,20,20,0.95); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.08); width: 900px; border-radius: 32px; padding: 40px; box-shadow: 0 40px 120px rgba(0,0,0,0.9); }
  .editor-layout { display: flex; gap: 30px; margin-bottom: 30px; }
  .editor-cover-section { width: 260px; display: flex; flex-direction: column; gap: 15px; }
  .editor-cover-preview { width: 100%; aspect-ratio: 1; border-radius: 24px; background: #111; border: 2px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; transition: all 0.3s; }
  .editor-cover-preview:hover { border-color: rgb(var(--accent-color)); background: rgba(var(--accent-color), 0.05); }
  .editor-cover-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .editor-cover-preview.has-cover img { display: block; }
  .editor-cover-preview.has-cover .upload-icon { display: none; }
  .upload-icon { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-subdued); font-size: 13px; font-weight: 500; text-align: center; }
  .upload-icon svg { width: 36px; height: 36px; fill: currentColor; }
  .editor-audio-section { flex: 1; display: flex; flex-direction: column; }
  .editor-title-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.1); color: white; font-size: 26px; font-weight: 800; padding-bottom: 12px; margin-bottom: 24px; outline: none; font-family: 'Inter', sans-serif; transition: border-color 0.3s; }
  .editor-title-input:focus { border-color: rgb(var(--accent-color)); }
  .trim-container { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 32px; position: relative; margin-bottom: 24px; }
  .trim-waveform { height: 100px; background: rgba(255,255,255,0.02); border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .trim-waveform-bars { display: flex; gap: 4px; height: 100%; align-items: center; opacity: 0.1; width: 100%; justify-content: space-around; padding: 0 10px; }
  .trim-waveform-bars div { width: 6px; background: white; border-radius: 3px; }
  .trim-selection { position: absolute; top: 0; bottom: 0; background: rgba(var(--accent-color), 0.15); border-left: 3px solid rgb(var(--accent-color)); border-right: 3px solid rgb(var(--accent-color)); left: 0%; right: 0%; pointer-events: none; }
  .dual-slider { position: relative; width: 100%; height: 30px; margin-top: 24px; }
  .dual-slider input[type=range] { position: absolute; width: 100%; pointer-events: none; appearance: none; height: 4px; background: none; top: 12px; }
  .dual-slider input[type=range]::-webkit-slider-thumb { pointer-events: all; appearance: none; width: 26px; height: 26px; border-radius: 50%; background: rgb(var(--accent-color)); cursor: pointer; box-shadow: 0 0 15px rgba(var(--accent-color), 0.6); margin-top: -11px; border: 3px solid white; }
  .dual-slider input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px; }
  .trim-times { display: flex; justify-content: space-between; margin-top: 10px; }
  .trim-input-group { display: flex; flex-direction: column; gap: 8px; }
  .trim-input-group label { font-size: 13px; color: var(--text-subdued); font-weight: 600; }
  .trim-input-group input { background: rgba(0,0,0,0.8); border: 1px solid #333; color: white; padding: 12px 16px; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 15px; outline: none; width: 110px; font-weight: 700; transition: border-color 0.3s; }
  .trim-input-group input:focus { border-color: rgb(var(--accent-color)); }
  .trim-preview { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .trim-preview button { background: white; color: black; border-radius: 50%; width: 48px; height: 48px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: transform 0.2s, box-shadow 0.2s; }
  .trim-preview button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px; }
  .btn { padding: 16px 32px; border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; border: none; transition: all 0.3s; }
  .btn-cancel { background: transparent; color: var(--text-base); border: 1px solid rgba(255,255,255,0.2); }
  .btn-cancel:hover { border-color: var(--text-base); background: rgba(255,255,255,0.05); }
  .btn-save { background: rgb(var(--accent-color)); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .btn-save:hover { filter: brightness(1.1); transform: scale(1.02); box-shadow: 0 0 20px rgba(var(--accent-color), 0.4); }

  /* === МОДАЛЬНОЕ ОКНО ОБЛОЖКИ === */
  .cover-modal-content { width: 600px; text-align: left; }
  .cover-modal-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; text-align: center; }
  .cover-tabs { display: flex; gap: 10px; margin-bottom: 24px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 12px; }
  .cover-tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-subdued); transition: all 0.2s; }
  .cover-tab:hover { color: var(--text-base); }
  .cover-tab.active { background: rgba(var(--accent-color), 0.2); color: rgb(var(--accent-color)); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .simple-cover-preview { width: 200px; height: 200px; border-radius: 24px; background: #111; margin: 0 auto 24px; border: 2px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
  .simple-cover-preview:hover { border-color: rgb(var(--accent-color)); background: rgba(var(--accent-color), 0.05); }
  .simple-cover-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .simple-cover-preview.has-cover img { display: block; }
  .simple-cover-preview.has-cover .upload-icon { display: none; }

  /* ДИХОТОМИЯ (Два круга) */
  .dichotomy-circles-container {
    display: flex; gap: 20px; justify-content: center; margin-bottom: 20px;
  }
  
  .crop-circle-wrapper {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  .crop-circle-mask {
    width: 200px; height: 200px; border-radius: 50%;
    position: relative; overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    border: 2px solid rgba(var(--accent-color), 0.5);
    cursor: grab; background: #111;
    display: flex; align-items: center; justify-content: center;
  }
  .crop-circle-mask:active { cursor: grabbing; }
  
  /* Картинка в редакторе */
  .crop-circle-mask img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    pointer-events: none;
    display: none;
    width: 100%; 
    height: auto;
  }
  
  .crop-circle-mask.has-img img { display: block; }
  
  .crop-circle-mask .upload-icon {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .crop-circle-mask.has-img .upload-icon { display: none; }

  .circle-label { font-weight: 700; color: var(--text-base); font-size: 14px; }
  
  .crop-controls { margin-top: 20px; display: flex; gap: 20px; width: 100%; }
  .crop-control-group { flex: 1; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 16px; }
  .crop-control-group label { display: block; font-size: 13px; color: var(--text-subdued); margin-bottom: 8px; font-weight: 600; }
  .crop-control-group input { width: 100%; cursor: pointer; accent-color: rgb(var(--accent-color)); }
  
  .full-cover-preview { width: 250px; height: 250px; border-radius: 50%; background: #111; margin: 0 auto 24px; border: 2px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
  .full-cover-preview:hover { border-color: rgb(var(--accent-color)); background: rgba(var(--accent-color), 0.05); }
  .full-cover-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .full-cover-preview.has-cover img { display: block; }
  .full-cover-preview.has-cover .upload-icon { display: none; }
  
  .crop-slider-container { margin-top: 20px; text-align: center; }
  .crop-slider-container label { display: block; font-size: 13px; color: var(--text-subdued); margin-bottom: 8px; font-weight: 600; }
  .crop-slider-container input { width: 80%; cursor: pointer; accent-color: rgb(var(--accent-color)); }
</style>
</head>
<body>

  <div class="global-bg" id="globalBg"></div>
  <div class="vignette"></div>

  <div class="main-layout">
    <div class="sidebar glass-panel">
      <div class="sidebar-header">
        Моя музыка
        <button class="add-btn" id="uploadBtn" title="Загрузить трек">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="audio/*">
      </div>
      <div class="track-list" id="trackList"></div>
    </div>

    <div class="now-playing-panel glass-panel">
      <div class="vinyl-stage" id="vinylStage">
        <div class="spin-container" id="spinContainer">
          <div class="vinyl-disc" id="vinylDisc">
            <div class="vinyl-cover" id="vinylCover">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              
              <img src="" id="imgNormal" class="img-normal" alt="cover">
              <img src="" id="imgSilent" class="img-half silent" alt="silent">
              <img src="" id="imgSound" class="img-half sound" alt="sound">
              <img src="" id="imgGif" class="img-gif" alt="gif">
              
              <div class="full-cover-overlay"></div>
            </div>
            <div class="vinyl-hole"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <div class="player-bar glass-panel">
    <div class="player-left">
      <div class="track-cover-small" id="playerCoverSmall" style="width: 72px; height: 72px;">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <img src="" id="playerCoverImg" alt="cover">
      </div>
      <div class="track-info"><div class="track-name" id="playerTitle" style="font-size: 17px;">Ничего не играет</div><div class="track-artist" id="playerArtist">-</div></div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Предыдущий">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Следующий">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Зациклить">
          <svg viewBox="0 0 24 24" id="repeatIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <div class="slider-container" id="progressContainer">
          <div class="slider-track"></div>
          <div class="slider-fill" id="progressFill"></div>
          <div class="slider-thumb-visual" id="progressThumb"></div>
          <input type="range" class="slider-input" id="progressInput" min="0" max="100" step="0.1" value="0">
        </div>
        <span id="totalTime" style="cursor: pointer;" title="Переключить время">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="speed-btn" id="speedBtn" title="Скорость воспроизведения">1x</button>
      <button class="volume-icon-btn" id="volumeIconBtn">
        <svg viewBox="0 0 24 24" id="volumeIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <div class="slider-container volume-container" id="volumeContainer">
        <div class="slider-track"></div>
        <div class="slider-fill" id="volumeFill" style="width: 100%;"></div>
        <div class="slider-thumb-visual" id="volumeThumb" style="left: 100%;"></div>
        <input type="range" class="slider-input" id="volumeInput" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <!-- КОНТЕКСТНОЕ МЕНЮ -->
  <div class="context-menu" id="contextMenu">
    <div class="context-item" id="menuEditTrack">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      Редактировать трек
    </div>
    <div class="context-item" id="menuChangeCover">
      <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      Сменить обложку
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО РЕДАКТОРА -->
  <div class="modal-overlay" id="editorModal">
    <div class="modal-content">
      <div class="editor-layout">
        <div class="editor-cover-section">
          <div class="editor-cover-preview" id="editorCoverPreview">
            <img src="" id="editorCoverImg" alt="cover">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
              Нажми, чтобы<br>загрузить обложку
            </div>
          </div>
          <input type="file" id="editorCoverInput" accept="image/*">
        </div>

        <div class="editor-audio-section">
          <input type="text" class="editor-title-input" id="editorTitle" placeholder="Название трека" value="Новый трек">
          
          <div class="trim-container">
            <div class="trim-preview">
              <button id="previewPlayBtn">▶</button>
              <div style="font-size: 14px; color: var(--text-subdued);" id="editorFileName">Файл не выбран</div>
            </div>
            
            <div class="trim-waveform" id="waveform">
              <div class="trim-waveform-bars">
                 <div style="height:40%;"></div><div style="height:70%;"></div><div style="height:30%;"></div><div style="height:90%;"></div>
                 <div style="height:50%;"></div><div style="height:60%;"></div><div style="height:20%;"></div><div style="height:80%;"></div>
                 <div style="height:45%;"></div><div style="height:65%;"></div><div style="height:35%;"></div><div style="height:85%;"></div>
                 <div style="height:55%;"></div><div style="height:75%;"></div><div style="height:25%;"></div><div style="height:95%;"></div>
              </div>
              <div class="trim-selection" id="trimSelection"></div>
            </div>
            
            <div class="dual-slider">
              <input type="range" id="startRange" min="0" max="100" value="0" step="0.1">
              <input type="range" id="endRange" min="0" max="100" value="100" step="0.1">
            </div>
            
            <div class="trim-times">
              <div class="trim-input-group"><label>Начало</label><input type="text" id="startTimeInput" value="0:00"></div>
              <div class="trim-input-group"><label>Конец</label><input type="text" id="endTimeInput" value="0:00"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancelEditorBtn">Отмена</button>
        <button class="btn btn-save" id="saveEditorBtn">Сохранить трек</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ОБЛОЖКИ -->
  <div class="modal-overlay" id="coverModal">
    <div class="modal-content cover-modal-content">
      <div class="cover-modal-title">Настройка обложки</div>
      
      <div class="cover-tabs">
        <div class="cover-tab active" data-tab="normal">Обычная</div>
        <div class="cover-tab" data-tab="dichotomy">Кадрирование</div>
        <div class="cover-tab" data-tab="gif">GIF</div>
        <div class="cover-tab" data-tab="full">Полная</div>
      </div>

      <!-- Обычная -->
      <div class="tab-content active" id="tab-normal">
        <div class="simple-cover-preview" id="normalPreview">
          <img src="" id="normalImg" alt="cover">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Загрузить картинку
          </div>
        </div>
        <input type="file" id="normalInput" accept="image/*">
      </div>

      <!-- Кадрирование (Дихотомия) -->
      <div class="tab-content" id="tab-dichotomy">
        <div class="dichotomy-circles-container">
          
          <!-- Левый круг (Тишина) -->
          <div class="crop-circle-wrapper">
            <div class="crop-circle-mask" id="cropCircleLeft">
              <div class="upload-icon">
                <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; fill: white; opacity: 0.5;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              </div>
              <img src="" id="cropImgLeft">
            </div>
            <div class="circle-label">Тишина</div>
            <button class="btn btn-save" onclick="document.getElementById('cropInputLeft').click()" style="padding: 6px 16px; font-size: 12px;">Загрузить</button>
            <input type="file" id="cropInputLeft" accept="image/*" style="display: none;">
          </div>

          <!-- Правый круг (Звук) -->
          <div class="crop-circle-wrapper">
            <div class="crop-circle-mask" id="cropCircleRight">
              <div class="upload-icon">
                <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; fill: white; opacity: 0.5;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              </div>
              <img src="" id="cropImgRight">
            </div>
            <div class="circle-label">Звук</div>
            <button class="btn btn-save" onclick="document.getElementById('cropInputRight').click()" style="padding: 6px 16px; font-size: 12px;">Загрузить</button>
            <input type="file" id="cropInputRight" accept="image/*" style="display: none;">
          </div>

        </div>
        
        <div class="crop-controls">
          <div class="crop-control-group">
            <label>Масштаб (Тишина): <span id="leftScaleVal">100%</span></label>
            <input type="range" id="leftScale" min="10" max="400" value="100" oninput="updateCrop(); document.getElementById('leftScaleVal').innerText = this.value + '%';">
          </div>
          <div class="crop-control-group">
            <label>Масштаб (Звук): <span id="rightScaleVal">100%</span></label>
            <input type="range" id="rightScale" min="10" max="400" value="100" oninput="updateCrop(); document.getElementById('rightScaleVal').innerText = this.value + '%';">
          </div>
        </div>
      </div>

      <!-- GIF -->
      <div class="tab-content" id="tab-gif">
        <div class="simple-cover-preview" id="gifPreview">
          <img src="" id="gifImg" alt="gif">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Загрузить GIF
          </div>
        </div>
        <input type="file" id="gifInput" accept="image/gif">
      </div>

      <!-- Полная обложка -->
      <div class="tab-content" id="tab-full">
        <div class="full-cover-preview" id="fullPreview">
          <img src="" id="fullImg" alt="cover">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            Загрузить картинку
          </div>
        </div>
        <input type="file" id="fullInput" accept="image/*">
        <div class="crop-slider-container">
          <label>Масштаб: <span id="fullScaleVal">100%</span></label>
          <input type="range" id="fullScale" min="10" max="300" value="100" oninput="updateCrop(); document.getElementById('fullScaleVal').innerText = this.value + '%';">
        </div>
      </div>

      <div class="modal-actions" style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <button class="btn btn-cancel" id="cancelCoverBtn">Отмена</button>
        <button class="btn btn-save" id="saveCoverBtn">Сохранить</button>
      </div>
    </div>
  </div>

<script>
  // --- ВСЕ ПЕРЕМЕННЫЕ ДЛЯ КАДРИРОВАНИЯ ---
  let editingCoverTrack = null;
  let coverMode = 'normal';
  
  let normalUrl = '';
  let silentUrl = '';
  let soundUrl = '';
  let gifUrl = '';
  let fullUrl = '';

  let leftPosX = 0, leftPosY = 0, leftScale = 1;
  let rightPosX = 0, rightPosY = 0, rightScale = 1;

  // Функция для обновления масштаба (визуал в модалке)
  window.updateCrop = function() {
    // Левый круг
    if (document.getElementById('cropImgLeft').src) {
      const lScaleVal = document.getElementById('leftScale').value / 100;
      leftScale = lScaleVal;
      document.getElementById('cropImgLeft').style.transform = `translate(calc(-50% + ${leftPosX}px), calc(-50% + ${leftPosY}px)) scale(${leftScale})`;
    }

    // Правый круг
    if (document.getElementById('cropImgRight').src) {
      const rScaleVal = document.getElementById('rightScale').value / 100;
      rightScale = rScaleVal;
      document.getElementById('cropImgRight').style.transform = `translate(calc(-50% + ${rightPosX}px), calc(-50% + ${rightPosY}px)) scale(${rightScale})`;
    }

    // Полная обложка
    if (document.getElementById('fullImg').src) {
      const fScaleVal = document.getElementById('fullScale').value / 100;
      document.getElementById('fullImg').style.transform = `scale(${fScaleVal})`;
    }
  };

  // Главная функция открытия окна обложки
  function openCoverModal(trackElement) {
    editingCoverTrack = trackElement;
    const coverDataStr = trackElement.dataset.cover;
    
    // Сброс
    document.getElementById('normalImg').src = ''; document.getElementById('normalPreview').classList.remove('has-cover');
    document.getElementById('cropImgLeft').src = ''; document.getElementById('cropCircleLeft').classList.remove('has-img');
    document.getElementById('cropImgRight').src = ''; document.getElementById('cropCircleRight').classList.remove('has-img');
    document.getElementById('gifImg').src = ''; document.getElementById('gifPreview').classList.remove('has-cover');
    document.getElementById('fullImg').src = ''; document.getElementById('fullPreview').classList.remove('has-cover');
    
    normalUrl = ''; silentUrl = ''; soundUrl = ''; gifUrl = ''; fullUrl = '';
    document.getElementById('leftScale').value = 100;
    document.getElementById('rightScale').value = 100;
    document.getElementById('fullScale').value = 100;
    document.getElementById('leftScaleVal').innerText = '100%';
    document.getElementById('rightScaleVal').innerText = '100%';
    document.getElementById('fullScaleVal').innerText = '100%';
    
    leftPosX = 0; leftPosY = 0; leftScale = 1;
    rightPosX = 0; rightPosY = 0; rightScale = 1;

    if (coverDataStr) {
      try {
        let data = JSON.parse(coverDataStr);
        coverMode = data.mode || 'normal';
        
        if (coverMode === 'normal') {
          normalUrl = data.url;
          document.getElementById('normalImg').src = normalUrl;
          document.getElementById('normalPreview').classList.add('has-cover');
        } else if (coverMode === 'gif') {
          gifUrl = data.url;
          document.getElementById('gifImg').src = gifUrl;
          document.getElementById('gifPreview').classList.add('has-cover');
        } else if (coverMode === 'dichotomy') {
          silentUrl = data.silent;
          soundUrl = data.sound;
          
          if (silentUrl) {
            document.getElementById('cropImgLeft').src = silentUrl;
            document.getElementById('cropCircleLeft').classList.add('has-img');
            leftPosX = data.leftX || 0;
            leftPosY = data.leftY || 0;
            leftScale = data.leftScale || 1;
            document.getElementById('leftScale').value = leftScale * 100;
            document.getElementById('leftScaleVal').innerText = Math.round(leftScale * 100) + '%';
          }
          
          if (soundUrl) {
            document.getElementById('cropImgRight').src = soundUrl;
            document.getElementById('cropCircleRight').classList.add('has-img');
            rightPosX = data.rightX || 0;
            rightPosY = data.rightY || 0;
            rightScale = data.rightScale || 1;
            document.getElementById('rightScale').value = rightScale * 100;
            document.getElementById('rightScaleVal').innerText = Math.round(rightScale * 100) + '%';
          }
          updateCrop();

        } else if (coverMode === 'full') {
          fullUrl = data.url;
          document.getElementById('fullImg').src = fullUrl;
          document.getElementById('fullPreview').classList.add('has-cover');
          document.getElementById('fullScale').value = (data.scale || 1) * 100;
          document.getElementById('fullScaleVal').innerText = Math.round((data.scale || 1) * 100) + '%';
          updateCrop();
        }
      } catch(e) {
        coverMode = 'normal';
        normalUrl = coverDataStr;
        document.getElementById('normalImg').src = normalUrl;
        document.getElementById('normalPreview').classList.add('has-cover');
      }
    }

    coverTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === coverMode));
    tabContents.forEach(c => c.classList.toggle('active', c.id === 'tab-' + coverMode));

    coverModal.classList.add('open');
  }

  // --- ТЕПЕРЬ ВСЕ ОСТАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
  const audio = document.getElementById('audio');
  const trackList = document.getElementById('trackList');
  const spinContainer = document.getElementById('spinContainer');
  const vinylCover = document.getElementById('vinylCover');
  const playerCoverSmall = document.getElementById('playerCoverSmall');
  const playerCoverImg = document.getElementById('playerCoverImg');
  const globalBg = document.getElementById('globalBg');
  
  const imgNormal = document.getElementById('imgNormal');
  const imgSilent = document.getElementById('imgSilent');
  const imgSound = document.getElementById('imgSound');
  const imgGif = document.getElementById('imgGif');
  
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');
  const progressInput = document.getElementById('progressInput');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const volumeInput = document.getElementById('volumeInput');
  const volumeFill = document.getElementById('volumeFill');
  const volumeThumb = document.getElementById('volumeThumb');
  const volumeIcon = document.getElementById('volumeIcon');
  const speedBtn = document.getElementById('speedBtn');
  const speedOptions = [1, 1.25, 1.5, 2, 0.75];
  let speedIndex = 0;
  
  let isPlaying = false;
  let currentTrackObj = null;
  let isShuffle = false;
  let repeatMode = 0; 
  let isTimeLeft = false;
  let lastVolume = 1;
  
  let tempAudioUrl = null;
  let tempAudioDuration = 0;
  let trimStartPercent = 0;
  let trimEndPercent = 100;
  let currentMenuTrack = null;
  const contextMenu = document.getElementById('contextMenu');

  // === АУДИО АНАЛИЗАТОР ===
  let audioContext, analyser, sourceNode, animationFrameId;

  function initAudioAnalyzer() {
    if (audioContext) return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256; 
    analyser.smoothingTimeConstant = 0.7;
    if (!sourceNode) {
      sourceNode = audioContext.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);
    }
  }

  function animateBass() {
    if (!analyser) return;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);
    let bassSum = 0;
    for (let i = 0; i < 10; i++) bassSum += dataArray[i];
    let bassAvg = bassSum / 10;
    let scale = 1 + (bassAvg / 255) * 0.05;
    document.documentElement.style.setProperty('--bass-scale', scale);
    animationFrameId = requestAnimationFrame(animateBass);
  }

  function getColorFromImage(imgUrl, callback) {
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.src = imgUrl;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 20; canvas.height = 20;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 20, 20);
      const data = ctx.getImageData(0, 0, 20, 20).data;
      let maxSat = 0;
      let bestR = 100, bestG = 100, bestB = 100;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        let max = Math.max(r, g, b);
        let min = Math.min(r, g, b);
        let sat = max - min;
        if (max > 50 && max < 250) {
          if (sat > maxSat) {
            maxSat = sat;
            bestR = r; bestG = g; bestB = b;
          }
        }
      }
      if (maxSat < 20) {
        let r=0, g=0, b=0, c=0;
        for (let i = 0; i < data.length; i += 4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; c++; }
        bestR = Math.floor(r/c); bestG = Math.floor(g/c); bestB = Math.floor(b/c);
      }
      bestR = Math.floor(bestR * 0.7 + 255 * 0.3);
      bestG = Math.floor(bestG * 0.7 + 255 * 0.3);
      bestB = Math.floor(bestB * 0.7 + 255 * 0.3);
      callback(`${bestR}, ${bestG}, ${bestB}`);
    };
  }

    newTrack.dataset.cover = coverDataStr;

    if (coverData.mode === 'normal' || coverData.mode === 'crop' || coverData.mode === 'full') { 
      thumbUrl = coverData.url; colorSourceUrl = coverData.url;

    else if (coverData.mode === 'gif') { thumbUrl = coverData.url; colorSourceUrl = coverData.url; }

  let isDraggingLeft = false;
  let startLeftX = 0, startLeftY = 0;
  let initialLeftX = 0, initialLeftY = 0;

  cropCircleLeft.addEventListener('mousedown', (e) => {
    if (!cropImgLeft.src) return;
    isDraggingLeft = true;
    startLeftX = e.clientX;
    startLeftY = e.clientY;
    initialLeftX = leftPosX;
    initialLeftY = leftPosY;
    cropCircleLeft.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', (e) => {
    if (isDraggingLeft) {
      leftPosX = initialLeftX + (e.clientX - startLeftX);
      leftPosY = initialLeftY + (e.clientY - startLeftY);
      updateCrop();
    }
  });

  document.addEventListener('mouseup', () => {
    isDraggingLeft = false;
    cropCircleLeft.style.cursor = 'grab';
  });

  // Правый круг (Звук)
  let isDraggingRight = false;
  let startRightX = 0, startRightY = 0;
  let initialRightX = 0, initialRightY = 0;

  cropCircleRight.addEventListener('mousedown', (e) => {
    if (!cropImgRight.src) return;
    isDraggingRight = true;
    startRightX = e.clientX;
    startRightY = e.clientY;
    initialRightX = rightPosX;
    initialRightY = rightPosY;
    cropCircleRight.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', (e) => {
    if (isDraggingRight) {
      rightPosX = initialRightX + (e.clientX - startRightX);
      rightPosY = initialRightY + (e.clientY - startRightY);
      updateCrop();
    }
  });

  document.addEventListener('mouseup', () => {
    isDraggingRight = false;
    cropCircleRight.style.cursor = 'grab';
  });

  // Загрузка фото
  cropInputLeft.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      silentUrl = event.target.result;
      cropImgLeft.src = silentUrl;
      cropCircleLeft.classList.add('has-img');
      leftPosX = 0; leftPosY = 0;
      document.getElementById('leftScale').value = 100;
      document.getElementById('leftScaleVal').innerText = '100%';
      updateCrop();
    };
    reader.readAsDataURL(file);
    cropInputLeft.value = '';
  });

  cropInputRight.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      soundUrl = event.target.result;
      cropImgRight.src = soundUrl;
      cropCircleRight.classList.add('has-img');
      rightPosX = 0; rightPosY = 0;
      document.getElementById('rightScale').value = 100;
      document.getElementById('rightScaleVal').innerText = '100%';
      updateCrop();
    };
    reader.readAsDataURL(file);
    cropInputRight.value = '';
  });

  // === ОСТАЛЬНЫЕ РЕЖИМЫ ===
  normalPreview.addEventListener('click', () => normalInput.click());
  normalInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      normalUrl = event.target.result;
      normalImg.src = normalUrl;
      normalPreview.classList.add('has-cover');
    };
    reader.readAsDataURL(file);
    normalInput.value = '';
  });

  gifPreview.addEventListener('click', () => gifInput.click());
  gifInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      gifUrl = event.target.result;
      gifImg.src = gifUrl;
      gifPreview.classList.add('has-cover');
    };
    reader.readAsDataURL(file);
    gifInput.value = '';
  });

  fullPreview.addEventListener('click', () => fullInput.click());
  fullInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      fullUrl = event.target.result;
      fullImg.src = fullUrl;
      fullPreview.classList.add('has-cover');
    };
    reader.readAsDataURL(file);
    fullInput.value = '';
  });

  document.getElementById('cancelCoverBtn').addEventListener('click', () => {
    coverModal.classList.remove('open');
  });

  document.getElementById('saveCoverBtn').addEventListener('click', () => {
    if (!editingCoverTrack) return;

    let finalCoverData = '';

    if (coverMode === 'normal' && normalUrl) {
      finalCoverData = JSON.stringify({ mode: 'normal', url: normalUrl });
    } 
    else if (coverMode === 'gif' && gifUrl) {
      finalCoverData = JSON.stringify({ mode: 'gif', url: gifUrl });
    }
    else if (coverMode === 'dichotomy' && silentUrl && soundUrl) {
      finalCoverData = JSON.stringify({ 
        mode: 'dichotomy', 
        silent: silentUrl, 
        sound: soundUrl,
        leftX: leftPosX, leftY: leftPosY, leftScale: leftScale,
        rightX: rightPosX, rightY: rightPosY, rightScale: rightScale
      });
    }
    else if (coverMode === 'full' && fullUrl) {
      const scaleValue = parseFloat(document.getElementById('fullScale').value) / 100;
      finalCoverData = JSON.stringify({ mode: 'full', url: fullUrl, scale: scaleValue });
    }

    editingCoverTrack.dataset.cover = finalCoverData;
    
    // Обновляем карточку
    let thumbUrl = '';
    let colorSourceUrl = '';

    if (coverMode === 'normal') { thumbUrl = normalUrl; colorSourceUrl = normalUrl; }
    else if (coverMode === 'gif') { thumbUrl = gifUrl; colorSourceUrl = gifUrl; }
    else if (coverMode === 'dichotomy') { thumbUrl = soundUrl; colorSourceUrl = soundUrl; }
    else if (coverMode === 'full') { thumbUrl = fullUrl; colorSourceUrl = fullUrl; }

    if (thumbUrl) {
      editingCoverTrack.classList.add('has-cover');
      editingCoverTrack.querySelector('.track-cover-small').classList.add('has-cover');
      editingCoverTrack.querySelector('.track-cover-small img').src = thumbUrl;
      
      getColorFromImage(colorSourceUrl, (colorStr) => {
        editingCoverTrack.style.setProperty('--track-color', `rgba(${colorStr}, 1)`);
      });
    } else {
      editingCoverTrack.classList.remove('has-cover');
      editingCoverTrack.querySelector('.track-cover-small').classList.remove('has-cover');
      editingCoverTrack.style.removeProperty('--track-color');
    }

    if (editingCoverTrack.classList.contains('active')) {
      applyCoverToPlayer(finalCoverData);
    }

    coverModal.classList.remove('open');
  });

  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      togglePlay();
    }
  });
</script>
</body>
</html>
